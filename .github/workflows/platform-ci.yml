name: platform-ci

# PRs are checked on pull_request; main is checked on push (the merge). Pushes to
# feature branches no longer start a second, duplicate run of the same commit: those
# doubled the load on shared runners and twice left a PR waiting on a runner that
# never came (PRs #43/#44).
on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "demo-operator/**"
      - "tools/**"
      - "client/**"
      - "games/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "platform/Dockerfile"
      - "infra/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - "demo-operator/**"
      - "tools/**"
      - "client/**"
      - "games/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "platform/Dockerfile"
      - "infra/**"
      - ".github/workflows/platform-ci.yml"
  workflow_dispatch:

# A newer push to the same PR / branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
            demo-operator/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: platform
      - run: npm ci
        working-directory: demo-operator
      # The single release gate: platform typecheck/test/build, demo-operator typecheck/test,
      # the client browser tests, and the production dependency audit (see package.json).
      - run: npm run verify:release

  # The end-to-end, real-Chrome checks (see package.json verify:browser): session
  # resume on both boot paths, the casino embedding boundary, the Round Inspector and
  # Campaign Manager consoles, the HMAC operator walkthrough, and the demo casino's
  # back-office and game page. Runs alongside release-check.
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platform/package-lock.json
            demo-operator/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: platform
      - run: npm ci
        working-directory: demo-operator
      # Screenshot dir for the checks that save PNGs (resume, embed); uploaded on failure.
      - run: echo "SHOTS_DIR=$RUNNER_TEMP/shots" >> "$GITHUB_ENV" && mkdir -p "$RUNNER_TEMP/shots"
      # On failure, the last log lines are also posted as annotations, so the cause is
      # readable from the PR checks API without downloading the log.
      - run: |
          set -o pipefail
          npm run verify:browser 2>&1 | tee "$RUNNER_TEMP/verify-browser.log"
      # GitHub keeps 10 annotations per step: post the failing lines, then the last two.
      - name: Failure lines as annotations
        if: failure()
        run: |
          grep -nE "FAIL|Error|not ok|timed out|Timeout" "$RUNNER_TEMP/verify-browser.log" | head -n 8 | sed 's/^/::error title=verify:browser::/'
          tail -n 2 "$RUNNER_TEMP/verify-browser.log" | sed 's/^/::error title=verify:browser (end)::/'
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  # The Lumina games as one family (package.json test:lumina, the same probes), split over
  # three parallel jobs: one job took 30 min with four games and hit 45 min with five on a
  # busy runner. This one: one chrome in every game (theme lint, chrome identity, shared
  # controls at the same places + idle zero) and the 48 px symbol sheet.
  lumina-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: |
          set -o pipefail
          (node tools/probes/theme-lint.mjs && node tools/probes/chrome-identity.mjs && node tools/probes/lumina-parity.mjs && node tools/probes/symbol-sheet.mjs) 2>&1 | tee "$RUNNER_TEMP/lumina.log"
      - name: Failure lines as annotations
        if: failure()
        run: |
          grep -nE "FAIL|Error|timed out|Timeout" "$RUNNER_TEMP/lumina.log" | head -n 8 | sed 's/^/::error title=lumina-checks::/'
          tail -n 2 "$RUNNER_TEMP/lumina.log" | sed 's/^/::error title=lumina-checks (end)::/'

  # Every game at the 9 sizes (in view, no overlap, hit areas, labels, contrast) and the
  # market switches.
  lumina-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: |
          set -o pipefail
          (node tools/probes/lumina-audit.mjs && node tools/probes/market-switches.mjs) 2>&1 | tee "$RUNNER_TEMP/lumina.log"
      - name: Failure lines as annotations
        if: failure()
        run: |
          grep -nE "FAIL|Error|timed out|Timeout" "$RUNNER_TEMP/lumina.log" | head -n 8 | sed 's/^/::error title=lumina-audit::/'
          tail -n 2 "$RUNNER_TEMP/lumina.log" | sed 's/^/::error title=lumina-audit (end)::/'

  # Rounds played: no celebration of a sub-stake return (30+ real rounds per game and market),
  # and Clockwork Menagerie's client (layout at 11 sizes, respins, big win, feature, UK
  # sub-stake, frame time). One job per group: Vault 20K alone takes ~12 min locally (it plays
  # on until it has seen three sub-stake rounds), all of them in one job ran past 35 min on CI.
  lumina-rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: vault
            cmd: node tools/probes/no-celebrate.mjs --rounds 30 --games vault
          - group: classic-relicforge
            cmd: node tools/probes/no-celebrate.mjs --rounds 30 --games classic,relicforge
          - group: glasshouse-clockwork
            cmd: node tools/probes/no-celebrate.mjs --rounds 30 --games glasshouse,clockwork && node tools/probes/clockwork-client.mjs
    name: lumina-rounds (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: |
          set -o pipefail
          (${{ matrix.cmd }}) 2>&1 | tee "$RUNNER_TEMP/lumina.log"
      - name: Failure lines as annotations
        if: failure()
        run: |
          grep -nE "FAIL|Error|timed out|Timeout" "$RUNNER_TEMP/lumina.log" | head -n 8 | sed 's/^/::error title=lumina-rounds::/'
          tail -n 2 "$RUNNER_TEMP/lumina.log" | sed 's/^/::error title=lumina-rounds (end)::/'

  # Reduced seeded RTP parity of the shared engine (the full 30M run stays a local /
  # certification step). Seeded, so a given engine always gives the same verdict: it
  # cannot flake, it only fails when the math really moved. Wider MAX_SE than the
  # certification run, sized for a 4-core runner (~1 min).
  rtp-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paid rounds (5M, base)
        run: node tools/rtp-parity.js
        env: { STEPS: "5000000", MAX_SE: "1.0" }
      - name: Bonus buys (500k)
        run: node tools/rtp-parity.js
        env: { MODE: buy, STEPS: "500000", MAX_SE: "0.25" }

  # Crash-safety gate (tools/bench/chaos.mjs): 200 players, the platform kill -9'd three
  # times under load and restarted on Postgres, then the mock casino's own ledger is
  # compared with ours. Fails on any lost acknowledged round, any debit with neither a
  # round nor a refund, or anything paid twice.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: vault20k_bench }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bench" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
        working-directory: platform
      - run: npm run build
        working-directory: platform
      # History served from SQL (bounded memory) must equal the full in-memory
      # recomputation; restart, chain tip, sweep and export from cold rows.
      - name: Postgres integration tests
        run: npx vitest run test/history-pg.test.ts
        working-directory: platform
        env: { TEST_DATABASE_URL: "postgres://bench:bench@127.0.0.1:5432/vault20k_bench" }
      - name: kill -9 under load, then compare ledgers
        run: node tools/bench/chaos.mjs
        env: { BENCH_DATABASE_URL: "postgres://bench:bench@127.0.0.1:5432/vault20k_bench" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-result
          path: qa/bench/chaos.json
          retention-days: 14

  # Deploys main to the single RGS server (infra/README.md) once every check passed.
  # Off until the server exists: set the repo variable DEPLOY_ENABLED=true and the
  # secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (a key allowed to run the commands below)
  # and DEPLOY_KNOWN_HOSTS (`ssh-keyscan -H <host>` output, checked once by hand: a pinned
  # host key means a spoofed server never receives the deploy).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [release-check, browser-checks, lumina-checks, lumina-audit, lumina-rounds, rtp-parity, chaos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Pull, rebuild and restart on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            cd /opt/provider && git fetch --quiet origin main && git checkout --quiet ${{ github.sha }}
            cd infra && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            for i in \$(seq 1 30); do
              docker compose -f docker-compose.prod.yml --env-file .env.prod ps platform | grep -q '(healthy)' && exit 0
              sleep 5
            done
            echo 'platform did not become healthy' >&2; exit 1"
