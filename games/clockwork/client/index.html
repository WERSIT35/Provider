<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1a120c">
  <title>Clockwork Menagerie</title>
  <!-- Start the session handshake and the rules while the scripts download (game.js picks
       them up): on Slow 4G every serial round trip is ~0.6 s. -->
  <link rel="preload" href="rules.json" as="fetch" crossorigin>
  <link rel="preload" href="game.js" as="script">
  <link rel="preload" href="assets/art/logo.webp" as="image">
  <link rel="preload" href="assets/fonts/spectral-sc-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/play/shell/shell.css">
  <script>
    (function () {
      var lt = new URLSearchParams(location.search).get("lt");
      if (!lt) return;
      window.__clockworkEarlySession = fetch("/game/v1/session/init", { method: "POST", headers: { authorization: "Bearer " + lt } })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); });
      window.__clockworkEarlySession.catch(function () {});
    })();
  </script>
  <style>
    /* Clockwork Menagerie (code clockwork): a toymaker's workshop, wind-up brass animals behind
       smoked glass. Design: games/clockwork/DESIGN.md. Art: assets/ART.md. Spectral SC +
       Alegreya Sans + Barlow Condensed, SIL OFL 1.1 (assets/fonts). */
    @font-face { font-family: "CW Display"; src: url("assets/fonts/spectral-sc-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "CW UI"; src: url("assets/fonts/alegreya-sans-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "CW Num"; src: url("assets/fonts/barlow-condensed-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    :root {
      --brass: #c99a4b; --brass-light: #f6d48e; --brass-dark: #5e3b16; --smoke: rgba(18, 13, 10, 0.8); --teal: #5ce6d2;
      --text: #fbeed6; --muted: #d6c3a4; --gap: clamp(6px, 1.6vmin, 14px);
      --display: "CW Display", Georgia, serif;
      --ui: "CW UI", "Trebuchet MS", system-ui, sans-serif;
      --num: "CW Num", "Arial Narrow", system-ui, sans-serif;
      font-family: var(--ui); font-weight: 700;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
    /* The workshop by lamplight; free spins: the same room at night, the lamps gone teal. The
       floor band is darkened so the message line keeps its contrast at every size. */
    body { background: #1a120c; }
    body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; transition: opacity 1.2s ease; background-size: cover; background-position: center 38%; }
    body::before { background-image: linear-gradient(180deg, rgba(14, 9, 6, 0.25), rgba(14, 9, 6, 0) 30%, rgba(14, 9, 6, 0) 58%, rgba(14, 9, 6, 0.86) 84%), url("assets/art/bg_base.webp"); }
    body::after { opacity: 0; background-image: linear-gradient(180deg, rgba(6, 12, 14, 0.25), rgba(6, 12, 14, 0) 30%, rgba(6, 12, 14, 0) 58%, rgba(6, 12, 14, 0.88) 84%), url("assets/art/bg_night.webp"); }
    body.night::after { opacity: 1; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
    :focus-visible { outline: 3px solid var(--brass-light); outline-offset: 2px; }

    /* The game's stage inside the Lumina Shell (client/shell): the logo and the cabinet. Every
       control, readout and dialog is the shell's; the themed slots take the skin from game.js. */
    .cw-stage { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--gap); position: relative; z-index: 1; }
    .sign { position: relative; display: grid; justify-items: center; padding-top: 4px; }
    .lobby-slot { position: absolute; left: 0; top: 0; z-index: 2; }
    .logo { margin: 0; line-height: 0; }
    .logo img { width: clamp(220px, 70vw, 440px); height: auto; display: block; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55)); }

    /* The cabinet: smoked glass in a brass rim, rivets at the corners. */
    .stage { position: relative; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; container-type: size; }
    .cabinet { --rim: clamp(6px, 1.4cqmin, 12px); position: relative; padding: var(--rim); border-radius: 18px;
      width: min(100cqw, calc((100cqh - 2 * var(--rim)) * 5 / 3 + 2 * var(--rim)));
      background: linear-gradient(160deg, var(--brass-light), var(--brass) 38%, var(--brass-dark) 100%);
      box-shadow: 0 0 0 2px #2a1709, inset 0 0 0 1px rgba(255, 240, 200, 0.5), 0 14px 40px rgba(0, 0, 0, 0.6); }
    .cabinet::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(circle at 10px 10px, #f6d48e 3px, #3a210c 4px, transparent 5px), radial-gradient(circle at calc(100% - 10px) 10px, #f6d48e 3px, #3a210c 4px, transparent 5px),
        radial-gradient(circle at 10px calc(100% - 10px), #f6d48e 3px, #3a210c 4px, transparent 5px), radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #f6d48e 3px, #3a210c 4px, transparent 5px); }
    .board { position: relative; width: 100%; aspect-ratio: 5 / 3; border-radius: 12px; overflow: hidden; background: var(--smoke);
      -webkit-backdrop-filter: blur(10px) saturate(0.8); backdrop-filter: blur(10px) saturate(0.8); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 2px 18px rgba(0, 0, 0, 0.7); }
    .board::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 45%); }
    .board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    @media (max-width: 560px) { .sign { padding-top: 30px; } }
    @media (orientation: portrait) and (min-height: 760px) { .logo img { width: min(90vw, 480px); } }
    @media (orientation: landscape) and (max-height: 520px) {
      .cw-stage { gap: 4px; }
      .sign { padding: 0 0 0 84px; }
      .logo img { width: min(40vw, 220px); }
    }
    @media (prefers-reduced-motion: reduce) { body::before, body::after { transition: none !important; } }
    html.lsh-reduced body::before, html.lsh-reduced body::after { transition: none !important; } /* the Menu switch */
  </style>
</head>
<body>
  <!-- The Lumina provider loader: the same in every game (layers.md, Layer 1). -->
  <div id="bootLoader" class="lsh-loader is-indeterminate" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="lsh-loader__inner"><svg class="lsh-loader__mark" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="none" stroke="#f2c14e" stroke-width="3"/><path d="M28 12 38 28 28 44 18 28Z" fill="#f2c14e"/><path d="M28 19 33 28 28 37 23 28Z" fill="#0b0f14"/></svg><div class="lsh-loader__word">LUMINA<small>GAMES</small></div><div class="lsh-loader__track"><div class="lsh-loader__bar" id="bootLoaderBar"></div></div><div class="lsh-loader__pct" id="bootLoaderPct"></div></div>
    </div>
  <div class="cw-stage" id="cwStage">
    <header class="sign">
      <div class="lobby-slot"></div>
      <h1 class="logo"><img src="assets/art/logo.webp" alt="Clockwork Menagerie" width="900" height="348"></h1>
    </header>
    <div class="stage">
      <div class="cabinet">
        <div class="board" id="board">
          <canvas id="reels" aria-label="Clockwork Menagerie reels"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Sounds come later (audio/, CC0 recordings only); until then the shared engine plays nothing. -->
  <script>window.VX_AUDIO_BASE = "audio/"; window.VX_AUDIO_PRELOAD = "manual";</script>
  <script src="/play/embed-bridge.js"></script>
  <script src="/play/audio/audio.js"></script>
  <script src="/play/notify.js"></script>
  <script src="/play/shell/motion.js"></script>
  <script src="/play/shell/shell.js"></script>
  <script src="/play/shell/board-view.js"></script>
  <script src="/play/shell/big-win.js"></script>
  <script src="game.js"></script>
</body>
</html>
