# Optional Postgres for the durable data path. In-memory stays the default (tests
# rely on it); this brings a real Postgres up in one command:
#
#   docker compose -f platform/docker-compose.yml up -d
#   cd platform
#   DATABASE_URL=postgres://bananax:bananax@127.0.0.1:5432/bananax npm run migrate
#   DATABASE_URL=postgres://bananax:bananax@127.0.0.1:5432/bananax npm run dev:seed
#
# The migration runner (src/db/migrate.ts) applies migrations/*.sql, so this compose
# does NOT auto-apply them via initdb — there is a single migration path.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bananax-postgres
    environment:
      POSTGRES_USER: bananax
      POSTGRES_PASSWORD: bananax
      POSTGRES_DB: bananax
    ports:
      - "5432:5432"
    volumes:
      - bananax-pg:/var/lib/postgresql/data

volumes:
  bananax-pg:
